# Local development database only. Production uses Supabase.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - tracker-db:/var/lib/postgresql/data
volumes:
  tracker-db:
